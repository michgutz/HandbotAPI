name: CI/CD (dev)

# PRs: build the image only. Pushes to master (or a manual run): build, push, and deploy to Cloud Run.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# None of these are secrets. Repository variables with the same names override the defaults.
env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'massive-incline-462117-n7' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  WIF_PROVIDER: ${{ vars.WIF_PROVIDER || 'projects/604566589662/locations/global/workloadIdentityPools/github/providers/github' }}
  DEPLOYER_SA: ${{ vars.DEPLOYER_SA || 'github-deployer@massive-incline-462117-n7.iam.gserviceaccount.com' }}
  DATASTORE_PROJECT_ID: ${{ vars.DATASTORE_PROJECT_ID || 'massive-incline-462117-n7' }}
  SERVICE_NAME: handbot-api
  AR_REPO: handbot

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t "${SERVICE_NAME}:${GITHUB_SHA}" .

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for Workload Identity Federation
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/${SERVICE_NAME}:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --service-account "${SERVICE_NAME}@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --port 8080 \
            --no-allow-unauthenticated \
            --set-env-vars "VertexAiSearch__ProjectId=${DATASTORE_PROJECT_ID}" \
            --quiet
